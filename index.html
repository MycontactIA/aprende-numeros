<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprende los números</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  #cam { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: 14px; left: 18px; font-size: 18px; font-weight: 600;
    text-shadow: 0 1px 3px #000; pointer-events: none; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; background: rgba(0, 0, 0, 0.7); }
  #menu h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); }
  #langs { display: flex; gap: 10px; }
  #langs button { font: inherit; font-size: 18px; padding: 10px 18px; border-radius: 12px;
    border: 2px solid #555; background: #222; color: #fff; cursor: pointer; }
  #langs button.sel { border-color: #7CFC9A; background: #1d3b2a; }
  #start { font: inherit; font-size: 24px; font-weight: 700; padding: 14px 40px; border: 0;
    border-radius: 16px; background: #7CFC9A; color: #111; cursor: pointer; }
  #start:disabled { opacity: 0.5; cursor: default; }
  #msg { margin: 0; min-height: 1.4em; font-size: 16px; text-align: center; max-width: 80vw; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="stage"></canvas>
<div id="hud"></div>
<div id="menu">
  <h1 id="title">Aprende los números</h1>
  <div id="langs">
    <button data-lang="es" class="sel">Español</button>
    <button data-lang="en">English</button>
    <button data-lang="fr">Français</button>
  </div>
  <button id="start">Empezar</button>
  <p id="msg"></p>
</div>

<script type="module">
// ---------- Constantes de diseño (van antes de la primera llamada a resize) ----------
const CDN_VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const CDN_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const GUIDE_SCALE = 0.62;      // ancho máximo del número como fracción del ancho de pantalla
const HIT_RADIUS = 36;         // distancia (px) para contar un punto como trazado
const SAMPLE_STEP = 16;        // separación de los puntos de la guía (px)
const DONE_FRACTION = 0.7;     // fracción de puntos trazados para completar el número
const CELEBRATE_MS = 2200;     // pausa tras completar un número
const TIP_RADIUS = 14;
const LOCALE = { es: "es-ES", en: "en-US", fr: "fr-FR" };
const T = {
  es: { title: "Aprende los números", start: "Empezar", loading: "Abriendo cámara y detector…",
        error: "No pude abrir la cámara o el detector. Revisa los permisos del navegador y tu conexión.",
        level: "Nivel", finished: "¡Terminaste todos los niveles!" },
  en: { title: "Learn the numbers", start: "Start", loading: "Opening camera and detector…",
        error: "I could not open the camera or the detector. Check browser permissions and your connection.",
        level: "Level", finished: "You finished all the levels!" },
  fr: { title: "Apprends les nombres", start: "Commencer", loading: "Ouverture de la caméra et du détecteur…",
        error: "Impossible d'ouvrir la caméra ou le détecteur. Vérifie les permissions du navigateur et ta connexion.",
        level: "Niveau", finished: "Tu as terminé tous les niveaux !" }
};
// Niveles: 0-10, 11-20, 40-100 (de 20 en 20), 150-500 (de 50 en 50), 600-1000 (de 100 en 100)
function seq(a, b, s) { const r = []; for (let x = a; x <= b; x += s) r.push(x); return r; }
const LEVELS = [seq(0, 10, 1), seq(11, 20, 1), seq(40, 100, 20), seq(150, 500, 50), seq(600, 1000, 100)];
const ITEMS = [];
LEVELS.forEach((nums, li) => nums.forEach(n => ITEMS.push({ n, level: li + 1 })));
const REWARDS_DEBUG_NAMES = ["chime", "arpeggio", "bubble", "clap"];

// ---------- Estado ----------
const DEBUG = new URLSearchParams(location.search).has("debug");
const video = document.getElementById("cam");
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const hudEl = document.getElementById("hud");
const menuEl = document.getElementById("menu");
const startBtn = document.getElementById("start");
const msgEl = document.getElementById("msg");
let cw = 0, ch = 0, dpr = 1;
let lang = "es";
let ac = null;
let landmarker = null;
let started = false;
let phase = "idle";           // idle | trace | celebrate | done
let idx = 0;
let celebrateUntil = 0;
let targets = [], visited = [], visitedCount = 0;
let glyphFont = "", glyphText = "";
let lastVideoTime = -1, lastResult = null, currentTip = null, fakeTip = null;
let lastReward = -1;
const events = [];
function log(ev, data) { if (DEBUG) events.push({ t: Math.round(performance.now()), ev, data }); }

// ---------- Números en palabras ----------
// --- números ---
const ES_UNITS = ["cero", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
const ES_10_29 = ["diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho",
  "diecinueve", "veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis",
  "veintisiete", "veintiocho", "veintinueve"];
const ES_TENS = { 3: "treinta", 4: "cuarenta", 5: "cincuenta", 6: "sesenta", 7: "setenta", 8: "ochenta", 9: "noventa" };
const ES_HUND = { 1: "ciento", 2: "doscientos", 3: "trescientos", 4: "cuatrocientos", 5: "quinientos",
  6: "seiscientos", 7: "setecientos", 8: "ochocientos", 9: "novecientos" };
function esWords(n) {
  if (n === 1000) return "mil";
  if (n >= 100) { const h = Math.floor(n / 100), r = n % 100; const head = n === 100 ? "cien" : ES_HUND[h]; return r ? head + " " + esWords(r) : head; }
  if (n < 10) return ES_UNITS[n];
  if (n < 30) return ES_10_29[n - 10];
  const t = Math.floor(n / 10), u = n % 10;
  return u ? ES_TENS[t] + " y " + ES_UNITS[u] : ES_TENS[t];
}
const EN_UNITS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
const EN_TEENS = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const EN_TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
function enWords(n) {
  if (n < 10) return EN_UNITS[n];
  if (n < 20) return EN_TEENS[n - 10];
  if (n < 100) { const t = Math.floor(n / 10), u = n % 10; return EN_TENS[t] + (u ? "-" + EN_UNITS[u] : ""); }
  if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; return EN_UNITS[h] + " hundred" + (r ? " " + enWords(r) : ""); }
  return "one thousand";
}
const FR_UNITS = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf"];
const FR_TEENS = ["dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
const FR_TENS = { 2: "vingt", 3: "trente", 4: "quarante", 5: "cinquante", 6: "soixante" };
function frWords(n) {
  if (n < 10) return FR_UNITS[n];
  if (n < 20) return FR_TEENS[n - 10];
  if (n < 70) {
    const t = Math.floor(n / 10), u = n % 10;
    if (u === 0) return FR_TENS[t];
    if (u === 1) return FR_TENS[t] + " et un";
    return FR_TENS[t] + "-" + FR_UNITS[u];
  }
  if (n < 80) { if (n === 71) return "soixante et onze"; return "soixante-" + frWords(n - 60); }
  if (n < 100) { if (n === 80) return "quatre-vingts"; return "quatre-vingt-" + frWords(n - 80); }
  if (n < 1000) {
    const h = Math.floor(n / 100), r = n % 100;
    const head = h === 1 ? "cent" : frWords(h) + (r === 0 ? " cents" : " cent");
    return r ? head + " " + frWords(r) : head;
  }
  return "mille";
}
function numberWords(n, l) { return l === "en" ? enWords(n) : l === "fr" ? frWords(n) : esWords(n); }
// --- fin números ---

// ---------- Geometría: cover + espejo, una sola función para video y overlay ----------
function coverRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh || !cw) return null;
  const s = Math.max(cw / vw, ch / vh);
  const dw = vw * s, dh = vh * s;
  return { ox: (cw - dw) / 2, oy: (ch - dh) / 2, dw, dh };
}
function mapPoint(lm) {
  const r = coverRect();
  if (!r) return null;
  return { x: cw - (r.ox + lm.x * r.dw), y: r.oy + lm.y * r.dh };
}

// ---------- Guía del número ----------
function buildTargets() {
  targets = []; visited = []; visitedCount = 0;
  if (phase === "idle" || phase === "done" || !cw || !ch) return;
  const text = String(ITEMS[idx].n);
  const off = document.createElement("canvas");
  off.width = cw; off.height = ch;
  const o = off.getContext("2d", { willReadFrequently: true });
  let size = ch * 0.5;
  o.font = `900 ${size}px system-ui, sans-serif`;
  const w = o.measureText(text).width;
  if (w > cw * GUIDE_SCALE) { size *= (cw * GUIDE_SCALE) / w; o.font = `900 ${size}px system-ui, sans-serif`; }
  glyphFont = o.font; glyphText = text;
  o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#000";
  o.fillText(text, cw / 2, ch / 2);
  const data = o.getImageData(0, 0, cw, ch).data;
  for (let y = SAMPLE_STEP / 2; y < ch; y += SAMPLE_STEP) {
    for (let x = SAMPLE_STEP / 2; x < cw; x += SAMPLE_STEP) {
      if (data[(Math.floor(y) * cw + Math.floor(x)) * 4 + 3] > 128) targets.push({ x, y });
    }
  }
  visited = new Array(targets.length).fill(false);
}
function updateTrace(tip) {
  if (!targets.length) return;
  const r2 = HIT_RADIUS * HIT_RADIUS;
  for (let i = 0; i < targets.length; i++) {
    if (visited[i]) continue;
    const dx = targets[i].x - tip.x, dy = targets[i].y - tip.y;
    if (dx * dx + dy * dy <= r2) { visited[i] = true; visitedCount++; }
  }
  if (visitedCount >= DONE_FRACTION * targets.length) completeNumber();
}

// ---------- Progreso ----------
function updateHud() {
  if (phase === "idle") { hudEl.textContent = ""; return; }
  if (phase === "done") { hudEl.textContent = T[lang].finished; return; }
  const it = ITEMS[idx];
  const nums = LEVELS[it.level - 1];
  hudEl.textContent = `${T[lang].level} ${it.level} · ${nums.indexOf(it.n) + 1}/${nums.length}`;
}
function completeNumber() {
  phase = "celebrate";
  celebrateUntil = performance.now() + CELEBRATE_MS;
  const n = ITEMS[idx].n;
  log("complete", { n });
  playReward();
  setTimeout(() => speak(numberWords(n, lang), lang), 500);
}
function nextNumber() {
  idx++;
  if (idx >= ITEMS.length) { phase = "done"; log("finished"); speak(T[lang].finished, lang); buildTargets(); updateHud(); return; }
  phase = "trace";
  log("next", { n: ITEMS[idx].n });
  buildTargets();
  updateHud();
}

// ---------- Voz ----------
function speak(text, l) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LOCALE[l];
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ---------- Recompensas sonoras aleatorias (Web Audio, sin archivos) ----------
function tone(freq, start, dur, type, vol) {
  const t = ac.currentTime + start;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function chime() { [1046.5, 1318.5, 1568].forEach(f => tone(f, 0, 1.2, "sine", 0.15)); }
function arpeggio() { [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, i * 0.12, 0.45, "triangle", 0.18)); }
function bubble() {
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(900, t);
  o.frequency.exponentialRampToValueAtTime(300, t + 0.25);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + 0.32);
}
function clap() {
  const len = Math.floor(ac.sampleRate * 0.15);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800;
  const g = ac.createGain(); g.gain.value = 0.5;
  src.connect(f).connect(g).connect(ac.destination);
  src.start();
}
const REWARDS = [chime, arpeggio, bubble, clap];
function playReward() {
  if (!ac) return;
  let i;
  do { i = Math.floor(Math.random() * REWARDS.length); } while (REWARDS.length > 1 && i === lastReward);
  lastReward = i;
  log("reward", { name: REWARDS_DEBUG_NAMES[i] });
  REWARDS[i]();
}

// ---------- Dibujo ----------
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, cw, ch);
  const r = coverRect();
  if (r && video.readyState >= 2) {
    ctx.save();
    ctx.translate(cw, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, r.ox, r.oy, r.dw, r.dh);
    ctx.restore();
  }
  if (phase === "trace" || phase === "celebrate") drawGuide();
  if (phase === "celebrate") {
    ctx.save();
    ctx.font = `900 ${ch * 0.3}px system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(124,252,154,0.9)";
    ctx.fillText("✓", cw / 2, ch / 2);
    ctx.restore();
  }
  const tip = fakeTip || currentTip;
  if (tip && phase === "trace") {
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, TIP_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd54f";
    ctx.fill();
  }
}
function drawGuide() {
  ctx.save();
  ctx.font = glyphFont; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillText(glyphText, cw / 2, ch / 2);
  ctx.setLineDash([12, 10]); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.strokeText(glyphText, cw / 2, ch / 2);
  ctx.setLineDash([]);
  for (let i = 0; i < targets.length; i++) {
    ctx.beginPath();
    ctx.arc(targets[i].x, targets[i].y, visited[i] ? 4 : 2.5, 0, Math.PI * 2);
    ctx.fillStyle = visited[i] ? "#7CFC9A" : "rgba(255,255,255,0.6)";
    ctx.fill();
  }
  ctx.restore();
}

// ---------- Bucle principal ----------
function loop() {
  requestAnimationFrame(loop);
  let tip = null;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    try { lastResult = landmarker.detectForVideo(video, performance.now()); } catch (e) { lastResult = null; }
  }
  if (lastResult && lastResult.landmarks && lastResult.landmarks.length) {
    tip = mapPoint(lastResult.landmarks[0][8]);
  }
  currentTip = fakeTip || tip;
  if (phase === "trace" && currentTip) updateTrace(currentTip);
  if (phase === "celebrate" && performance.now() > celebrateUntil) nextNumber();
  draw();
}

// ---------- Menú e inicio ----------
function updateMenu() {
  document.getElementById("title").textContent = T[lang].title;
  startBtn.textContent = T[lang].start;
}
async function makeLandmarker(mod, vision) {
  for (const delegate of ["GPU", "CPU"]) {
    try {
      return await mod.HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: MODEL, delegate },
        runningMode: "VIDEO",
        numHands: 1
      });
    } catch (e) { console.warn("detector", delegate, e); }
  }
  throw new Error("no detector");
}
async function start() {
  if (started) return;
  started = true;
  startBtn.disabled = true;
  msgEl.textContent = T[lang].loading;
  // El AudioContext se crea dentro del clic para que el navegador lo permita.
  ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume().catch(() => {});
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
    video.srcObject = stream;
    await video.play();
    const mod = await import(CDN_VISION);
    const vision = await mod.FilesetResolver.forVisionTasks(CDN_WASM);
    landmarker = await makeLandmarker(mod, vision);
  } catch (e) {
    console.error(e);
    msgEl.textContent = T[lang].error;
    startBtn.disabled = false;
    started = false;
    return;
  }
  menuEl.style.display = "none";
  msgEl.textContent = "";
  idx = 0; phase = "trace";
  log("start", { lang });
  buildTargets();
  updateHud();
}

document.querySelectorAll("#langs button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    document.querySelectorAll("#langs button").forEach(x => x.classList.toggle("sel", x === b));
    updateMenu();
  });
});
startBtn.addEventListener("click", start);
window.addEventListener("pagehide", () => {
  video.srcObject?.getTracks().forEach(t => t.stop());
  landmarker?.close?.();
});

function resize() {
  dpr = window.devicePixelRatio || 1;
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  if (phase === "trace" || phase === "celebrate") buildTargets();
}
resize();
window.addEventListener("resize", resize);
updateMenu();
loop();

if (DEBUG) {
  window.__dbg = {
    setTip(x, y) { fakeTip = x == null ? null : { x, y }; },
    complete() { if (phase === "trace") completeNumber(); },
    state() { return { idx, phase, n: ITEMS[idx] && ITEMS[idx].n, targets: targets.length, visited: visitedCount, lang }; },
    events
  };
}
</script>
</body>
</html>
